<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>YYC³ Agent 操作中心 · AI Family</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-weight='700' font-family='sans-serif' fill='%23fff'%3EY%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --bg2: #12121a;
        --bg3: #1a1a2e;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.15);
        --text: #f1f1f6;
        --text2: rgba(255, 255, 255, 0.65);
        --text3: rgba(255, 255, 255, 0.35);
        --accent-v: #8b5cf6;
        --accent-c: #06b6d4;
        --accent-e: #22c55e;
        --accent-r: #ef4444;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      }
      .light {
        --bg: #f5f5f0;
        --bg2: #e8e8e3;
        --bg3: #ddd;
        --surface: rgba(0, 0, 0, 0.02);
        --surface-hover: rgba(0, 0, 0, 0.05);
        --border: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.15);
        --text: #1a1a2e;
        --text2: rgba(0, 0, 0, 0.55);
        --text3: rgba(0, 0, 0, 0.3);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      ::selection {
        background: rgba(139, 92, 246, 0.3);
        color: #fff;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transition: transform 0.3s;
        overflow-y: auto;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .sb-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
      }
      .sb-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .sb-logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent-v), var(--accent-c));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
      }
      .sb-logo-text {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .sb-logo-sub {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1px;
      }
      .sb-search {
        margin: 12px 16px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sb-search:focus-within {
        border-color: var(--accent-v);
      }
      .sb-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
      }
      .sb-search input::placeholder {
        color: var(--text3);
      }
      .sb-search svg {
        width: 14px;
        height: 14px;
        color: var(--text3);
        flex-shrink: 0;
      }
      .sb-progress {
        margin: 0 16px 12px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .sb-progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .sb-progress-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.8px;
        color: var(--text3);
      }
      .sb-progress-pct {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-v);
      }
      .sb-progress-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
      }
      .sb-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-v), var(--accent-c));
        transition: width 0.6s;
        border-radius: 2px;
      }
      .sb-progress-count {
        font-size: 10px;
        color: var(--text3);
        margin-top: 4px;
      }
      .sb-nav {
        padding: 8px 12px 80px;
      }
      .sb-group {
        margin-bottom: 16px;
      }
      .sb-group-title {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.2px;
        color: var(--text3);
        padding: 0 8px;
        margin-bottom: 4px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.15s;
        text-decoration: none;
      }
      .sb-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .sb-item.active {
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
      }
      .sb-item .sb-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--text3);
        transition: 0.3s;
      }
      .sb-item .sb-dot.done {
        background: var(--accent-e);
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
      }
      .sb-item .sb-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .main {
        flex: 1;
        margin-left: 280px;
        min-height: 100vh;
        transition: margin-left 0.3s;
      }
      .main.expanded {
        margin-left: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        background: rgba(10, 10, 15, 0.8);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
      }
      .light .topbar {
        background: rgba(245, 245, 240, 0.8);
      }
      .topbar-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-subtitle {
        font-size: 12px;
        color: var(--text3);
      }
      .topbar-spacer {
        flex: 1;
      }
      .topbar-search {
        display: none;
        flex: 1;
        max-width: 320px;
        position: relative;
      }
      .main.expanded .topbar-search {
        display: block;
      }
      .topbar-search input {
        width: 100%;
        padding: 6px 12px 6px 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        outline: none;
        font-family: inherit;
      }
      .topbar-search input:focus {
        border-color: var(--accent-v);
        background: var(--bg2);
      }
      .topbar-search input::placeholder {
        color: var(--text3);
      }
      .topbar-search .ts-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 13px;
        pointer-events: none;
      }
      .topbar-time {
        display: none;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text2);
        font-family: var(--font-mono);
        padding: 4px 10px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .main.expanded .topbar-time {
        display: flex;
      }
      .topbar-time .tt-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-e);
        animation: pulse-dot 2s infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .btn-share,
      .btn-theme,
      .btn-menu,
      .btn-download {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-share:hover,
      .btn-theme:hover,
      .btn-menu:hover,
      .btn-download:hover {
        background: var(--surface-hover);
        color: var(--accent-v);
        border-color: rgba(139, 92, 246, 0.3);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dashboard {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .dash-header {
        margin-bottom: 32px;
      }
      .dash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .dash-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.2;
      }
      .dash-desc {
        font-size: 14px;
        color: var(--text2);
        max-width: 700px;
        line-height: 1.5;
      }
      .dash-stats {
        display: flex;
        gap: 16px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .stat-card {
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-num {
        font-size: 22px;
        font-weight: 700;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text2);
      }
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .filter-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 500;
      }
      .filter-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }
      .filter-btn.active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .cat-section {
        margin-bottom: 36px;
      }
      .cat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .cat-icon {
        font-size: 20px;
      }
      .cat-name {
        font-size: 16px;
        font-weight: 600;
      }
      .cat-count {
        font-size: 12px;
        color: var(--text3);
      }
      .cat-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      .guide-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.25s;
        display: block;
        color: inherit;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.4s both;
        padding: 0;
      }
      .guide-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow);
      }
      .guide-card .gc-bar {
        height: 3px;
        width: 100%;
      }
      .guide-card .gc-body {
        padding: 16px;
      }
      .guide-card.hidden {
        display: none;
      }
      .gc-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
      }
      .gc-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .gc-info {
        flex: 1;
        min-width: 0;
      }
      .gc-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .gc-title-en {
        font-size: 10px;
        color: var(--text3);
        font-weight: 400;
      }
      .gc-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 2px;
      }
      .gc-tag {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 600;
      }
      .gc-tag.agents {
        background: rgba(139, 92, 246, 0.12);
        color: #8b5cf6;
      }
      .gc-tag.skills {
        background: rgba(6, 182, 212, 0.12);
        color: #06b6d4;
      }
      .gc-tag.plugins {
        background: rgba(236, 72, 153, 0.12);
        color: #ec4899;
      }
      .gc-tag.tools {
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
      }
      .gc-tag.core {
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
      }
      .gc-tag.featured {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }
      .gc-desc {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .gc-cmd {
        margin-top: 8px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent-c);
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: all;
        transition: 0.15s;
      }
      .gc-cmd:hover {
        background: rgba(0, 0, 0, 0.35);
      }
      .gc-cmd .cmd-copy {
        margin-left: auto;
        font-size: 12px;
        opacity: 0.5;
        flex-shrink: 0;
      }
      .gc-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .gc-tags span {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--text3);
        border: 1px solid var(--border);
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .guide-detail {
        display: none;
        padding: 24px;
        max-width: 960px;
        margin: 0 auto;
      }
      .guide-detail.active {
        display: block;
      }
      .gd-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
        margin-bottom: 20px;
      }
      .gd-back:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .gd-hero {
        padding: 24px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .gd-hero-top {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 12px;
      }
      .gd-hero-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      .gd-hero-info {
        flex: 1;
      }
      .gd-hero-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .gd-hero-desc {
        font-size: 13px;
        color: var(--text2);
        line-height: 1.5;
      }
      .gd-hero-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .gd-hero-meta span {
        font-size: 12px;
        color: var(--text3);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .gd-section {
        margin-bottom: 28px;
      }
      .gd-section h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gd-section h3 .h-icon {
        font-size: 18px;
      }
      .gd-section p,
      .gd-section li {
        font-size: 13px;
        color: var(--text2);
        line-height: 1.7;
      }
      .gd-section ul,
      .gd-section ol {
        padding-left: 18px;
        margin-bottom: 10px;
      }
      .gd-section li {
        margin-bottom: 4px;
      }
      table.doc-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
        font-size: 13px;
      }
      table.doc-table th,
      table.doc-table td {
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      table.doc-table th {
        font-weight: 600;
        color: var(--text2);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background: var(--surface);
      }
      table.doc-table td {
        color: var(--text2);
      }
      table.doc-table tr:hover td {
        background: var(--surface-hover);
      }
      .code-block {
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid var(--border);
        margin-bottom: 10px;
      }
      .code-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
      }
      .code-hdr span {
        font-size: 11px;
        color: var(--text3);
        font-family: var(--font-mono);
      }
      .copy-btn {
        padding: 3px 10px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 11px;
        transition: 0.2s;
        background: var(--surface);
        color: var(--text2);
      }
      .copy-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .copy-btn.copied {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }
      .code-block pre {
        padding: 12px 14px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--text);
        tab-size: 2;
        background: var(--bg);
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
        gap: 16px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--accent-v);
        animation: spin 0.8s infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      ul.agent-list {
        list-style: none;
        padding: 0;
      }
      ul.agent-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 8px;
      }
      ul.agent-list li:hover {
        border-color: var(--border-hover);
      }
      .agent-num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .agent-info {
        flex: 1;
      }

      const ALL = [...AGENTS, ...SKILLS, ...PLUGINS, ...TOOLS_LIST, ...CORES];

        agents: '🤖 AI Family',

        tools: '🧰 工具',
        core: '📦 核心包',
      };
      const CATI = { agents: '🤖', skills: '🛠️', plugins: '🔌', tools: '🧰', core: '📦' };
      const CATC = { agents: '#8b5cf6', skills: '#06b6d4', plugins: '#ec4899', tools: '#f59e0b', core: '#22c55e' };
      let done = new Set();
      try {
        const d = JSON.parse(localStorage.getItem('yyc3_done'));
        if (d) done = new Set(d);
      } catch (e) {}
      function svD() {
        localStorage.setItem('yyc3_done', JSON.stringify([...done]));
      }
      function pct() {
        const t = ALL.length;
        const d = done.size;
        return Math.round((d / t) * 100);
      }
      function renderSB() {
        const n = document.getElementById('sbNav');
        let h = '';
        for (const [cat, lb] of Object.entries(CATS)) {
          const its = ALL.filter((g) => g.cat === cat);
          h += `<div class="sb-group"><div class="sb-group-title">${lb}</div>`;
          its.forEach((g) => {
            h += `<a class="sb-item" href="#" onclick="showG('${g.id}')"><span class="sb-dot${done.has(g.id) ? ' done' : ''}"></span><span class="sb-label">${g.title}</span></a>`;
          });
          h += `</div>`;
        }
        n.innerHTML = h;
      }
      function renderD(f = 'all') {
        const c = document.getElementById('dashC');
        const cats = [...new Set(ALL.map((g) => g.cat))];
        let h = '';
        cats.forEach((cat) => {
          const its =
            f === 'all'
              ? ALL.filter((g) => g.cat === cat)
              : ALL.filter((g) => g.cat === cat && g.title.toLowerCase().includes(f));
          if (!its.length) return;
          h += `<div class="cat-section"><div class="cat-header"><span class="cat-icon">${CATI[cat]}</span><span class="cat-name">${CATS[cat]}</span><span class="cat-count">${its.length}</span><div class="cat-line"></div></div><div class="card-grid">`;

            h += `<div class="guide-card" onclick="showG('${g.id}')"><div class="gc-bar" style="background:${CATC[g.cat]}"></div><div class="gc-body"><div class="gc-head"><div class="gc-icon" style="background:${g.color || CATC[g.cat]}22;color:${g.color || CATC[g.cat]}">${g.icon}</div><div class="gc-info"><div class="gc-title">${g.title}${g.en ? ` <span class="gc-title-en">${g.en}</span>` : ''}</div><div class="gc-meta"><span class="gc-tag ${g.cat}">${CATS[g.cat]}</span>${g.role ? `<span class="gc-time">${g.role}</span>` : ''}${g.v ? `<span class="gc-time">v${g.v}</span>` : ''}</div></div></div><div class="gc-desc">${g.desc}</div>`;
            if (g.tags) {
              h += `<div class="gc-tags">${g.tags
                .slice(0, 3)
                .map((t) => `<span>${t}</span>`)
                .join('')}</div>`;
            }
            if (g.cmd) {
              h += `<div class="gc-cmd">${g.cmd}<span class="cmd-copy">📋</span></div>`;
            }
            h += `</div></div>`;
          });
          h += `</div></div>`;
        });
        c.innerHTML = h;
        rFB();
        rSt();
        document.querySelectorAll('.gc-cmd').forEach((el) =>
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            const t = this.textContent.replace('📋', '').trim();
            navigator.clipboard.writeText(t).then(() => {
              const o = this.querySelector('.cmd-copy');
              o.textContent = '✅';
              setTimeout(() => (o.textContent = '📋'), 1500);
            });
          })
        );
      }
      function rFB() {
        const b = document.getElementById('fBar');
        let h = '<button class="filter-btn active" data-c="all" onclick="fG(\'all\',this)">📋 全部</button>';
        for (const [c, l] of Object.entries(CATS)) {
          h += `<button class="filter-btn" data-c="${c}" onclick="fG('${c}',this)">${CATI[c]} ${l}</button>`;
        }
        b.innerHTML = h;
      }
      function fG(c, btn) {
        document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.cat-section').forEach((s) => {
          const catName = s.querySelector('.cat-name').textContent;
          if (c === 'all' || catName === CATS[c]) s.style.display = '';
          else s.style.display = 'none';
        });
      }
      function rSt() {
        const s = document.getElementById('dashS');
        s.innerHTML = `<div class="stat-card"><span class="stat-num">8</span><span class="stat-label">AI 智能体</span></div><div class="stat-card"><span class="stat-num">283</span><span class="stat-label">社区技能</span></div><div class="stat-card"><span class="stat-num">121</span><span class="stat-label">市场化技能</span></div><div class="stat-card"><span class="stat-num">202</span><span class="stat-label">NVIDIA 技能</span></div><div class="stat-card"><span class="stat-num">80+</span><span class="stat-label">插件</span></div><div class="stat-card"><span class="stat-num">6</span><span class="stat-label">工具</span></div>`;

        const g = ALL.find((x) => x.id === id);

        const d = document.getElementById('gd');
        const v = document.getElementById('dashV');
        v.style.display = 'none';
        d.classList.add('active');
        document.getElementById('tbT').textContent = g.title;
        document.getElementById('tbS').textContent = g.desc;
        let h = `<button class="gd-back" onclick="showDash()">← 返回总览</button>
<div class="gd-hero"><div class="gd-hero-top"><div class="gd-hero-icon" style="background:${g.color || CATC[g.cat]}22;color:${g.color || CATC[g.cat]}">${g.icon}</div><div class="gd-hero-info"><div class="gd-hero-title">${g.title}${g.en ? ` (${g.en})` : ''}</div><div class="gd-hero-desc">${g.desc}</div><div class="gd-hero-meta"><span>🏷️ ${(g.tags || []).join(' · ') || CATS[g.cat]}</span><span>📂 ${CATS[g.cat]}</span>${g.role ? `<span>🎯 ${g.role}</span>` : ''}</div></div></div></div>
<div style="margin-bottom:20px;padding:12px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--border)"><label><input type="checkbox" onchange="togD('${g.id}')"${done.has(g.id) ? ' checked' : ''}> 标记为已读</label></div>`;
        // detail content
        if (g.cat === 'agents') {
          h += `<div class="gd-section"><h3><span class="h-icon">📋</span>基础档案</h3><table class="doc-table"><tr><th>属性</th><th>内容</th></tr><tr><td>名号</td><td>${g.title} (${g.en})</td></tr><tr><td>角色</td><td>${g.role}</td></tr><tr><td>核心能力</td><td>${(g.tags || []).join('、')}</td></tr><tr><td>管理层级</td><td>${CATS[g.cat]}</td></tr><tr><td>CLI 命令</td><td><code>${g.cmd}</code></td></tr></table></div>`;

        }
        if (g.cat === 'skills' || g.cat === 'plugins') {
          h += `<div class="gd-section"><h3><span class="h-icon">⚡</span>快速安装</h3><div class="code-block"><div class="code-hdr"><span>bash</span><button class="copy-btn" onclick="copyC(this)">复制</button></div><pre>${g.cmd}</pre></div></div>`;

        renderSB();

        document.body.classList.toggle('light');

        const l = v.toLowerCase();

        fS(v);

      function sharePg() {
        const t = document.getElementById('tbT').textContent;

      }
      function downloadPg() {
        const b = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'YYC3-Agent-Hub.html';
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function copyC(btn) {
        const code = btn.closest('.code-block').querySelector('pre').textContent;
        navigator.clipboard.writeText(code).then(() => {
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '复制';
            btn.classList.remove('copied');
          }, 2000);
        });
      }
      function updClock() {
        const d = new Date();
        document.getElementById('clockD').textContent = d.toLocaleTimeString('zh-CN', { hour12: false });
      }
      setInterval(updClock, 1000);
      updClock();
