<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--surface:rgba(255,255,255,0.03);--surface-hover:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.08);--border-hover:rgba(255,255,255,0.15);--text:#f1f1f6;--text2:rgba(255,255,255,0.65);--text3:rgba(255,255,255,0.35);--accent-v:#76b900;--accent-c:#06b6d4;--accent-e:#22c55e;--accent-r:#ef4444;--radius:14px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,0.3);--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace}
.light{--bg:#f5f5f0;--bg2:#e8e8e3;--bg3:#ddd;--surface:rgba(0,0,0,0.02);--surface-hover:rgba(0,0,0,0.05);--border:rgba(0,0,0,0.08);--border-hover:rgba(0,0,0,0.15);--text:#1a1a2e;--text2:rgba(0,0,0,0.55);--text3:rgba(0,0,0,0.3);--shadow:0 4px 24px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
::selection{background:rgba(118,185,0,0.3);color:#fff}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform 0.3s}
.sidebar.hidden{transform:translateX(-100%)}
.sb-header{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent-v),var(--accent-c));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.sb-logo-text{font-size:15px;font-weight:700;color:var(--text)}
.sb-logo-sub{font-size:10px;color:var(--text3);letter-spacing:1px}
.sb-search{margin:12px 16px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px}
.sb-search:focus-within{border-color:var(--accent-v)}
.sb-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.sb-search input::placeholder{color:var(--text3)}
.sb-search svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
.sb-progress{margin:0 16px 12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border)}
.sb-progress-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sb-progress-label{font-size:10px;font-weight:600;letter-spacing:0.8px;color:var(--text3)}
.sb-progress-pct{font-size:11px;font-weight:700;color:var(--accent-v)}
.sb-progress-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.sb-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-v),var(--accent-c));transition:width 0.6s;border-radius:2px}
.sb-progress-count{font-size:10px;color:var(--text3);margin-top:4px}
.sb-nav{padding:8px 12px 80px;overflow-y:auto;flex:1}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-group{margin-bottom:16px}
.sb-group-title{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--text3);padding:0 8px;margin-bottom:4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer;transition:0.15s;text-decoration:none}
.sb-item:hover{background:var(--surface-hover);color:var(--text)}
.sb-item.active{background:rgba(118,185,0,0.12);color:var(--accent-v)}
.sb-item .sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--text3);transition:0.3s}
.sb-item .sb-dot.done{background:var(--accent-e);box-shadow:0 0 6px rgba(34,197,94,0.4)}
.sb-item .sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;margin-left:280px;min-height:100vh;transition:margin-left 0.3s}
.main.expanded{margin-left:0}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(10,10,15,0.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.light .topbar{background:rgba(245,245,240,0.8)}
.topbar-title{font-size:16px;font-weight:600}
.topbar-subtitle{font-size:12px;color:var(--text3)}
.topbar-spacer{flex:1}
.topbar-search{display:none;flex:1;max-width:320px;position:relative}
.main.expanded .topbar-search{display:block}
.topbar-search input{width:100%;padding:6px 12px 6px 32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.topbar-search input:focus{border-color:var(--accent-v);background:var(--bg2)}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-search .ts-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.topbar-time{display:none;align-items:center;gap:5px;font-size:12px;color:var(--text2);font-family:var(--font-mono);padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--border)}
.main.expanded .topbar-time{display:flex}
.topbar-time .tt-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-e);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}
.btn-share,.btn-theme,.btn-menu,.btn-download{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s}
.btn-share:hover,.btn-theme:hover,.btn-menu:hover,.btn-download:hover{background:var(--surface-hover);color:var(--accent-v);border-color:rgba(118,185,0,0.3)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.dashboard{padding:24px;max-width:1400px;margin:0 auto}
.dash-header{margin-bottom:32px}
.dash-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(118,185,0,0.12);color:var(--accent-v);font-size:11px;font-weight:600;margin-bottom:8px}
.dash-title{font-size:28px;font-weight:700;margin-bottom:6px;line-height:1.2}
.dash-desc{font-size:14px;color:var(--text2);max-width:700px;line-height:1.5}
.dash-stats{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.stat-card{padding:12px 18px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:10px}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:var(--text2)}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:0.2s;font-weight:500}
.filter-btn:hover{border-color:var(--border-hover);color:var(--text)}
.filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.cat-section{margin-bottom:36px}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cat-icon{font-size:20px}
.cat-name{font-size:16px;font-weight:600}
.cat-count{font-size:12px;color:var(--text3)}
.cat-line{flex:1;height:1px;background:var(--border)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.skill-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--sk-color,#76b900);border-radius:var(--radius-sm);padding:12px 14px;cursor:default;transition:0.2s}
.skill-card:hover{border-color:var(--border-hover);background:var(--surface-hover)}
.skill-card .sk-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.skill-card .sk-name{font-size:13px;font-weight:600;color:var(--text)}
.skill-card .sk-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:6px}
.skill-card .sk-cmd{padding:3px 6px;background:rgba(0,0,0,0.2);border-radius:3px;font-family:var(--font-mono);font-size:10px;color:var(--accent-c);cursor:pointer;user-select:all;display:inline-block;transition:0.15s}
.skill-card .sk-cmd:hover{background:rgba(0,0,0,0.35)}
.skill-card .sk-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.skill-card .sk-tags span{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)}
.list-section{margin-bottom:32px}
.list-section h3{font-size:15px;font-weight:600;margin-bottom:10px;padding:8px 12px;border-radius:6px;background:var(--surface);border-left:3px solid var(--accent-v)}
.skill-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.skill-item{padding:6px 10px;border-radius:4px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--text2);transition:0.15s;font-family:var(--font-mono)}
.skill-item:hover{border-color:var(--border-hover);color:var(--text)}
.gd-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px;transition:0.2s;margin-bottom:20px;text-decoration:none}
.gd-back:hover{background:var(--surface-hover);color:var(--text)}
@media(max-width:768px){.sidebar{width:100%}.sidebar.hidden{transform:translateX(-100%)}.main{margin-left:0}.dashboard{padding:16px}.topbar{padding:10px 16px}.skills-grid{grid-template-columns:1fr}.skill-list{grid-template-columns:1fr}}
</style>
</head>

let done=new Set();try{const d=JSON.parse(localStorage.getItem('nvidia_done'));if(d)done=new Set(d)}catch(e){}
function svD(){localStorage.setItem('nvidia_done',JSON.stringify([...done]))}
let allSkills=[];for(const[k,v]of Object.entries(SKILLS)){v.forEach(s=>{allSkills.push({...s,cat:k})})}
function renderSB(){
const n=document.getElementById('sbNav');let h='';
for(const[cat,lb]of Object.entries(CATS)){
const its=SKILLS[cat]||[];if(!its.length)continue;
h+=`<div class="sb-group"><div class="sb-group-title">${lb}</div>`;
its.forEach(s=>{h+=`<a class="sb-item" href="#" onclick="scrollTo('sk-${s.n}')"><span class="sb-dot${done.has(s.n)?' done':''}"></span><span class="sb-label">${s.n}</span></a>`});
h+=`</div>`}
n.innerHTML=h;
}
function renderD(f){
const c=document.getElementById('dashC');let h='';
for(const[cat,lb]of Object.entries(CATS)){
const its=SKILLS[cat]||[];if(!its.length)continue;
if(f&&f!=='all'){const filtered=its.filter(s=>s.n.includes(f)||s.d.includes(f)||s.t.some(t=>t.includes(f)));if(!filtered.length)continue}
h+=`<div class="list-section" id="sec-${cat}"><h3 style="border-color:${CATC[cat]}"><span>${CATI[cat]} ${lb}</span><span style="margin-left:auto;font-weight:400;font-size:12px;color:var(--text3)">${its.length} 技能</span></h3><div class="skill-list">`;
(f?its.filter(s=>s.n.includes(f)||s.d.includes(f)||s.t.some(t=>t.includes(f))):its).forEach(s=>{
const p=done.has(s.n);h+=`<div class="skill-card" id="sk-${s.n}" style="border-left-color:${CATC[cat]}"><div class="sk-head"><span class="sk-name">${s.n}</span><label style="margin-left:auto;width:16px;height:16px;border-radius:3px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;background:${p?'var(--accent-e)':'transparent'}" onclick="event.stopPropagation();togD('${s.n}')">${p?'✓':''}</label></div><div class="sk-desc">${s.d}</div><div class="sk-tags">${s.t.map(t=>`<span>${t}</span>`).join('')}</div></div>`});
h+=`</div></div>`}
c.innerHTML=h;
document.querySelectorAll('.skill-card').forEach(el=>{el.addEventListener('click',function(){const id=this.id.replace('sk-','');togD(id)})});
rFB();rSt();
}
function rFB(){
const b=document.getElementById('fBar');
let h='<button class="filter-btn active" data-c="all" onclick="fG(\'all\',this)">📋 全部 (202)</button>';
for(const[cat,lb]of Object.entries(CATS)){const its=SKILLS[cat]||[];if(its.length){h+=`<button class="filter-btn" data-c="${cat}" onclick="fG('${cat}',this)">${CATI[cat]} ${lb} (${its.length})</button>`}}
b.innerHTML=h;
}
function fG(c,btn){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
document.querySelectorAll('.list-section').forEach(s=>{s.style.display=(c==='all'||s.id==='sec-'+c)?'':'none'});
}
function rSt(){const s=document.getElementById('dashS');let t=allSkills.length,d=done.size;s.innerHTML=`<div class="stat-card"><span class="stat-num">${t}</span><span class="stat-label">总技能</span></div><div class="stat-card"><span class="stat-num">${Object.keys(SKILLS).length}</span><span class="stat-label">分类</span></div><div class="stat-card"><span class="stat-num">${d}</span><span class="stat-label">已读</span></div>`}
function togD(id){if(done.has(id))done.delete(id);else done.add(id);svD();renderSB();rSt();const el=document.getElementById('sk-'+id);if(el){const lb=el.querySelector('label');if(lb){lb.style.background=done.has(id)?'var(--accent-e)':'transparent';lb.textContent=done.has(id)?'✓':''}}}
function scrollTo(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.borderColor='var(--accent-v)';setTimeout(()=>{el.style.borderColor=''},2000)}}
function togT(){document.body.classList.toggle('light');const i=document.getElementById('ti');i.innerHTML=document.body.classList.contains('light')?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'}
function togS(){document.getElementById('sidebar').classList.toggle('hidden');document.getElementById('main').classList.toggle('expanded')}
function fS(v){const l=v.toLowerCase();document.querySelectorAll('.sb-item').forEach(i=>{i.style.display=i.textContent.toLowerCase().includes(l)?'':'none'})}
function topbarSearch(v){fS(v);renderD(v)}
function sharePg(){const t=document.getElementById('tbT').textContent;if(navigator.share)navigator.share({title:t,text:t,url:location.href}).catch(()=>{});else navigator.clipboard.writeText(location.href).then(()=>alert('链接已复制！'))}
function downloadPg(){const b=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NVIDIA-技能中心.html';a.click();URL.revokeObjectURL(a.href)}
function updClock(){const d=new Date();document.getElementById('clockD').textContent=d.toLocaleTimeString('zh-CN',{hour12:false})}
setInterval(updClock,1000);updClock();
renderSB();renderD('all');rSt();
</script>
