<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--surface:rgba(255,255,255,0.03);--surface-hover:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.08);--border-hover:rgba(255,255,255,0.15);--text:#f1f1f6;--text2:rgba(255,255,255,0.65);--text3:rgba(255,255,255,0.35);--accent-v:#f59e0b;--accent-c:#06b6d4;--accent-e:#22c55e;--radius:14px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,0.3);--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
::selection{background:rgba(245,158,11,0.3);color:#fff}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform 0.3s}
.sidebar.hidden{transform:translateX(-100%)}
.sb-header{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent-v),var(--accent-c));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.sb-logo-text{font-size:14px;font-weight:700;color:var(--text)}
.sb-logo-sub{font-size:9px;color:var(--text3);letter-spacing:1px}
.sb-search{margin:12px 16px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px}
.sb-search:focus-within{border-color:var(--accent-v)}
.sb-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.sb-search input::placeholder{color:var(--text3)}
.sb-search svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
.sb-progress{margin:0 16px 12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border)}
.sb-progress-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sb-progress-label{font-size:10px;font-weight:600;letter-spacing:0.8px;color:var(--text3)}

.sb-progress-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden}

.sb-nav{padding:8px 12px 80px;overflow-y:auto;flex:1}

.sb-group{margin-bottom:12px}

.sb-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;transition:0.15s;text-decoration:none}
.sb-item:hover{background:var(--surface-hover);color:var(--text)}
.sb-item.active{background:rgba(245,158,11,0.12);color:var(--accent-v)}
.sb-item .sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;margin-left:280px;min-height:100vh;transition:margin-left 0.3s}
.main.expanded{margin-left:0}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(10,10,15,0.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.light .topbar{background:rgba(245,245,240,0.8)}
.topbar-title{font-size:16px;font-weight:600}
.topbar-subtitle{font-size:12px;color:var(--text3)}
.topbar-spacer{flex:1}
.topbar-search{display:none;flex:1;max-width:320px;position:relative}
.main.expanded .topbar-search{display:block}
.topbar-search input{width:100%;padding:6px 12px 6px 32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;font-family:inherit}

.btn-share,.btn-theme,.btn-menu,.btn-download{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s}

.stat-card{padding:12px 18px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:10px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

.gd-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px;transition:0.2s;margin-bottom:20px;text-decoration:none}

@media(max-width:768px){.sidebar{width:100%}.sidebar.hidden{transform:translateX(-100%)}.main{margin-left:0}.dashboard{padding:16px}.skill-grid{grid-template-columns:1fr 1fr}.card-grid{grid-template-columns:1fr}.topbar{padding:10px 16px}}
</style>
</head>

FEATURED.forEach(s=>{
if(f&&!s.n.includes(f)&&!s.d.includes(f))return;
h+=`<a class="guide-card" href="skills-hub/community/${s.n}/" onclick="event.preventDefault()"><div class="gc-bar" style="background:${s.c}"></div><div class="gc-head"><div class="gc-icon" style="background:${s.c}22;color:${s.c}">${s.i}</div><div class="gc-info"><div class="gc-title">${s.n} <span class="gc-title-en">${s.e}</span></div></div></div><div class="gc-desc">${s.d}</div><div class="gc-cmd">${s.cmd}<span class="cmd-copy">📋</span></div></a>`});
h+=`</div>`;
h+=`<div style="margin:28px 0 16px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border)"><strong style="font-size:14px">📋 完整技能列表 · ${ALL_SKILLS.size} 技能</strong><span style="margin-left:12px;font-size:12px;color:var(--text3)">按分类浏览全部社区贡献技能</span></div>`;
CATEGORIES.forEach(cat=>{
const its=f?cat.skills.filter(s=>s.includes(f)):cat.skills;
if(!its.length)return;
h+=`<div class="list-section" id="sec-${cat.id}"><h3 style="border-color:${cat.color}"><span>${cat.icon} ${cat.name}</span><span class="sl-count">${its.length} 技能</span></h3><div class="skill-grid">`;
its.forEach(s=>{
const isFeatured=FEATURED.find(f=>f.n===s);
h+=`<span class="skill-tag${isFeatured?' featured':''}" id="sk-${s}">${s}</span>`});
h+=`</div></div>`});
c.innerHTML=h;rSt();
document.querySelectorAll('.gc-cmd').forEach(el=>el.addEventListener('click',function(e){e.stopPropagation();const t=this.textContent.replace('📋','').trim();navigator.clipboard.writeText(t).then(()=>{const o=this.querySelector('.cmd-copy');o.textContent='✅';setTimeout(()=>o.textContent='📋',1500)})}));
}
function rSt(){const s=document.getElementById('dashS');s.innerHTML=`<div class="stat-card"><span class="stat-num">283</span><span class="stat-label">总技能</span></div><div class="stat-card"><span class="stat-num">${CATEGORIES.length}</span><span class="stat-label">分类</span></div><div class="stat-card"><span class="stat-num">12</span><span class="stat-label">精选</span></div><div class="stat-card"><span class="stat-num">283</span><span class="stat-label">可安装</span></div>`}
function scrollTo(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='rgba(245,158,11,0.15)';setTimeout(()=>el.style.background='',2000)}}
function showDash(){}
function togT(){document.body.classList.toggle('light');const i=document.getElementById('ti');i.innerHTML=document.body.classList.contains('light')?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'}
function togS(){document.getElementById('sidebar').classList.toggle('hidden');document.getElementById('main').classList.toggle('expanded')}
function fS(v){const l=v.toLowerCase();document.querySelectorAll('.sb-item').forEach(i=>{i.style.display=i.textContent.toLowerCase().includes(l)?'':'none'});renderD(l)}
function topbarSearch(v){fS(v)}
function sharePg(){const t=document.getElementById('tbT').textContent;if(navigator.share)navigator.share({title:t,text:t,url:location.href}).catch(()=>{});else navigator.clipboard.writeText(location.href).then(()=>alert('链接已复制！'))}
function downloadPg(){const b=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='社区-技能中心.html';a.click();URL.revokeObjectURL(a.href)}
function updClock(){const d=new Date();document.getElementById('clockD').textContent=d.toLocaleTimeString('zh-CN',{hour12:false})}
setInterval(updClock,1000);updClock();
renderSB();renderD('');rSt();
</script>
</body>
